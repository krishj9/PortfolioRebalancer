services:
  backend:
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ~/.aws:/root/.aws:ro
      - ./backend:/app
      - ./prompts:/app/prompts
    stdin_open: true
    tty: true
    command: >
      sh -c "pip install --no-cache-dir debugpy &&
             python -m debugpy --listen 0.0.0.0:5678 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
